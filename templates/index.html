<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Informe de WhatsApp</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/informes.css') }}">
 </head>

 <body class="min-h-screen flex items-center justify-center"
      style="background: linear-gradient(135deg, #fff7f1, #fdf3ea);">



 <div class="bg-white p-10 rounded-2xl shadow-xl w-full max-w-4xl border flex gap-10">

    
      
     <!-- LADO IZQUIERDO -->
        <div class="flex-1 flex flex-col justify-center">

      <!-- Contenedor que junta DropZone + Botón -->
     <div class="flex flex-col gap-6 mt-10">

        <!-- DropZone -->
        <div id="dropZone" class="drop-zone">
            <p class="text-gray-700 mb-2">Arrastra tu archivo <strong>.zip</strong> aquí</p>
            <p class="text-sm text-gray-500">o haz clic para seleccionarlo</p>
            <input id="fileInput" type="file" name="archivo" accept=".zip" class="hidden" required>
        </div>

        <!-- Botón -->
        <button type="submit"
            form="uploadForm"
            class="w-full bg-[#F5821F] hover:bg-[#d87018] text-white font-semibold py-2 px-4 rounded-lg transition">
            Generar Informe
        </button>

    </div>

</div>


    <!-- LADO DERECHO -->
    <div class="flex-1">

        <!-- Título -->
        <h1 class="text-2xl font-bold mb-6 text-[#F5821F] text-center">
            Parámetros del Informe
        </h1>

        <!-- Formulario -->
        <form id="uploadForm" action="/procesar" method="POST" enctype="multipart/form-data">

            <!-- Fecha -->
            <div class="mb-4">
                <label for="fecha_inicio" class="block font-semibold text-gray-700 mb-1">
                    Fecha desde la que analizaremos:
                </label>
                <input 
                    type="date" 
                    name="fecha_inicio" 
                    id="fecha_inicio"
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F5821F]"
                    
                >
            </div>

            <!-- Dropdown -->
            <div class="relative mb-4">
                <label class="block font-semibold text-gray-700 mb-1">Selecciona el mes:</label>

                <button id="dropdownButton" type="button"
                    class="w-full bg-white border border-gray-300 text-gray-700 py-2 px-4 rounded-lg shadow-sm hover:bg-gray-50 flex justify-between items-center">
                    <span id="selectedMonthText">Seleccionar mes correspondiente al chat</span>
                    <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 9l-7 7-7-7"/>
                    </svg>
                </button>

                <!-- Lista -->
                <div id="dropdownMenu"
                    class="absolute w-full mt-1 bg-white border border-gray-300 rounded-lg shadow-lg hidden z-20">
                    
                    <ul class="py-2 text-gray-700">
                        <li class="hover:bg-gray-100 px-4 py-2 cursor-pointer month-option" data-month="enero">Enero</li>
                        <li class="hover:bg-gray-100 px-4 py-2 cursor-pointer month-option" data-month="febrero">Febrero</li>
                        <li class="hover:bg-gray-100 px-4 py-2 cursor-pointer month-option" data-month="marzo">Marzo</li>
                        <li class="hover:bg-gray-100 px-4 py-2 cursor-pointer month-option" data-month="abril">Abril</li>
                        <li class="hover:bg-gray-100 px-4 py-2 cursor-pointer month-option" data-month="mayo">Mayo</li>
                        <li class="hover:bg-gray-100 px-4 py-2 cursor-pointer month-option" data-month="junio">Junio</li>
                        <li class="hover:bg-gray-100 px-4 py-2 cursor-pointer month-option" data-month="julio">Julio</li>
                        <li class="hover:bg-gray-100 px-4 py-2 cursor-pointer month-option" data-month="agosto">Agosto</li>
                        <li class="hover:bg-gray-100 px-4 py-2 cursor-pointer month-option" data-month="septiembre">Septiembre</li>
                        <li class="hover:bg-gray-100 px-4 py-2 cursor-pointer month-option" data-month="octubre">Octubre</li>
                        <li class="hover:bg-gray-100 px-4 py-2 cursor-pointer month-option" data-month="noviembre">Noviembre</li>
                        <li class="hover:bg-gray-100 px-4 py-2 cursor-pointer month-option" data-month="diciembre">Diciembre</li>
                    </ul>
                </div>

                <input type="hidden" name="mesSeleccionado" id="mesSeleccionado"  required>

                
            </div>
             <!-- CONTENEDOR DE BOTONES DE CONSOLIDADO -->
           <div class="mt-4 flex gap-3 justify-between">

               <button id="btnConsolidar"
                class="flex-1 bg-[#F5821F] hover:bg-[#d87018] text-white px-3 py-2 rounded-lg text-sm font-semibold">
                Consolidado del Mes
              </button>

               <button id="btnConsolidarAnual" class="btn btn-primary"
                class="flex-1 bg-[#F5821F] hover:bg-[#d87018] text-white px-3 py-2 rounded-lg text-sm font-semibold">
                 Consolidado del Año
              </button>

            </div>
        </form>

    </div>

</div>

                </div>

                <input type="hidden" name="mesSeleccionado" id="mesSeleccionado" required>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/informes.js') }}"></script>
    <script src="{{ url_for('static', filename='js/boton_meses.js') }}"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


    <!-- Mensaje backend -->

        {% if mensaje %}
        <script>
         mostrarMensajeBackend({{ mensaje|tojson|safe }});
        </script>
        {% endif %}

   

</body>
</html>
